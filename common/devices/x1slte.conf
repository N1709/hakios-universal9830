# Samsung Galaxy S20 (SM-G980F, x1slte, LTE) -- Exynos 990. Derived from y2s.conf (S20+ 5G, same SoC).
# Every value below was read from this phone on 2026-11-05: ~/ios-port-research/device/DEVICE.md
NAME="Samsung Galaxy S20 (x1slte, SM-G980F)"
KIND=phone
SOC="Samsung Exynos 990 (S5E9830)"
BOOTLOADER="G980FXXSNHYB7"

# --- boot chain (Samsung) ---------------------------------------------------------------------------
# sboot -> recovery (69009408 B, same as y2s) -> BootShim -> Mu-Silicium x1sltePkg -> xnuloader -> XNU
UEFI_TARGET=x1slte
FD_BASE=0xE8000000              # "UEFI FD" in x1sPkg's MemoryMapLib
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000         # y2s's 16 MB staging window. NOTE: overlaps cp_rmem (0xF0000000, 8 MB) in
                                # G980F's DT. The modem is not started under this port; verify on the phone.
FB_BASE=0xF1000000              # Display Reserved: the loader matches platform_exynos990 (same SoC; board values via boot-args)
GIC_V2=1
DTBH_FILE=${DTBH_FILE:-inputs/x1slte/boot-dtb.img} # Samsung DT table from the builder's own stock boot.img
WIFI_ATH11K=0

# --- memory (8 GB: banks 0x80000000-0xBAAFFFFF, 0xC1200000-0xDFFFFFFF, 0xE1900000-0xFFFFFFFF, 0x880000000-0x9FFFFFFFF)
EL2_EARLYMEM=0x9FEC00000        # 20 MB, set by sboot (x1sPkg has 0xAFE800000: the 12 GB S20 5G's)
ABOX_RMEM=0xF8000000            # 42 MB below 4 GB: the audio ring (Scion's ABOX fix needs one below 4 GB)

# --- storage: never y2s's offsets ---------------------------------------------------------------------
SUPER_TAIL_START=0x1E8B04000    # super's free tail (1.238 GB); y2s's 0x184B00000 is inside this phone's vendor
# iOS root and /private/var: pinned, preallocated files in Android's userdata (plain f2fs, unencrypted),
# found with FIEMAP. Filled in by tools/x1slte-pinfiles.sh once the files exist:
ROOT_FILE=/data/darwin/system.img
VAR_FILE=/data/darwin/var.img
# iOS only (2026-11-06), Android gone, userdata whole: was ROOT_UD_OFF=29559357440 # byte offset of system.img's single extent inside userdata
# iOS only (2026-11-06), Android gone, userdata whole: was ROOT_UD_LEN=2726297600
# iOS only (2026-11-06): the system volume's own partition, super (Android's system/vendor gone): super+0, 4 GiB, far
# below the loader's log at SUPER_TAIL_START. ROOT_PART=super boots from it (set once system.apfs is written there).
ROOT_SUPER_OFF=0
ROOT_SUPER_LEN=4294967296 
# iOS only (2026-11-06), Android gone, userdata whole: was VAR_UD_FIRST=7882240 # var.img's extent in 4096-byte blocks inside userdata (kernel ufs_win=FIRST:BLOCKS)
# iOS only (2026-11-06), Android gone, userdata whole: was VAR_UD_BLOCKS=4194304 

# --- board parts (dtbo X1SLTE EUR OPEN rev 21) --------------------------------------------------------
PANEL=s6e3hab_hubble1           # 1440x3200@60, 1080x2400@120 modes
TOUCH="sec_ts y79a @0x48 (tsp_sec/y79a_x1.bin)"
WIFI_FW=bcmdhd_sta.bin_b1       # NVRAM by module: read .cid.info from the EFS backup
PMIC_GAUGE="MAX77705 @0x66 hsi2c7"

# --- what the run needs -----------------------------------------------------------------------------
DEFAULT_SECS=900
ROOT_PART=super                 # iOS only (2026-11-06): the system volume boots from super+0
USERLAND_VARS="SOFTWARE_PASSCODE=1" # native keybagd + fail-closed restore; see docs/devices/x1slte/passcode.md
