# Samsung Galaxy S20 Ultra 5G (z3s, SM-G988B) -- Exynos 990. See docs/Z3S.md.
# The z3q profile is the reference for the userland and the XNU userspace side; the SoC and the
# boot chain are different and the loader is not written yet.
NAME="Samsung Galaxy S20 Ultra 5G (z3s, SM-G988B)"
KIND=phone
SOC="Samsung Exynos 990 (universal9830)"

# --- boot chain (phones) ---------------------------------------------------------------------------
# There is no Mu-Silicium UEFI for Exynos: S-Boot loads boot.img (kernel + ramdisk + DTB) from the
# boot partition. The z3s loader is still being designed, so build the kernel and images only.
BOOT_CHAIN=none
BOOT_VIA=twrp
UEFI_TARGET=
UEFI_FD=
DTB=
FD_BASE=0x0                     # not used until the z3s loader exists
FD_SIZE=0x0
PAYLOAD_BASE=0x0

# --- kernel and loader -----------------------------------------------------------------------------
# S-Boot passes s3cfb.bootloaderfb=0xe9000000. The region is 1440 x 3200 x 4 bytes = 0x1194000 bytes,
# at the top of the bootloader's splash/display reservation (sboot adds the bootloader_fb node).
FB_BASE=0xE9000000
WIFI_ATH11K=0                   # the z3s uses a Broadcom radio, not the WCN6750/ath11k

# --- what the run needs ----------------------------------------------------------------------------
# Start with the framebuffer only. Touch, buttons, storage and the GPU need Exynos drivers first.
BOOTARGS="cpus=8"
DEFAULT_SECS=300
USERLAND_VARS="GL="
FIRMWARE=""
