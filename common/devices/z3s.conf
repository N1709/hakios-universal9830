# Samsung Galaxy S20 Ultra 5G (z3s, SM-G988B) -- Exynos 990. See docs/devices/z3s/.
# Facts below are read from the stock G988BXXUBDUI5 boot image, device tree and PIT.
# The phone's GPT has not been dumped: the PIT gives names and sizes, not the disk total.
NAME="Samsung Galaxy S20 Ultra 5G (z3s, SM-G988B)"
KIND=phone
SOC="Samsung Exynos 990 (S5E9830)"
BOOTLOADER="G988BXXUBDUI5"

# --- boot chain (Samsung) ---------------------------------------------------------------------------
# sboot -> recovery (BootShim + z3s UEFI + two XNUP payloads) -> XNU.
# The z3s UEFI package is devices/exynos990/z3s/uefi-z3s/. The boot image
# builds with devices/exynos990/z3s/build-boot.sh; the common boot-image step
# stays off until UEFI_FD is set and the GPT is measured.
BOOT_CHAIN=none
UEFI_TARGET=z3s
UEFI_FD=
DTB=
FD_BASE=0xE8000000              # UEFI FD slot from the y2s/x1slte S5E9830 map
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000         # kernel payload window: 15 MB + 1 MB panic log, below the display
FB_BASE=0xF1000000              # UEFI Display Reserved (same S5E9830 map as y2s)
GIC_V2=1
DTBH_FILE=${DTBH_FILE:-inputs/z3s/boot-dtb.img} # Samsung DT table from the phone's own stock boot.img
WIFI_ATH11K=0                   # BCM4375: brcmfmac, not ath11k

# --- memory (12 GB, from the stock G988BXXUBDUI5 DTB) ------------------------------------------------
# banks: 0x80000000+0x3AB00000, 0xC1200000+0x1EE00000, 0xE1900000+0x1E700000, 0x880000000+0x27E800000
EL2_EARLYMEM=0xAFE800000        # 24 MB at the top of the 12 GB high bank
ABOX_RMEM=0xF8000000            # 42 MB below 4 GB: the audio ring

# --- storage: PIT measured, GPT not dumped ----------------------------------------------------------
# PIT PICASSO3_EUR_OPEN.pit (G988BXXUBDUI5 CSC, 43 entries, SHA-256
# a1c7842cd03fcae5231588e602827e7e219dccdf2aeffaf8283c78b472d2b392):
#   boot     0x7990000  61,865,984
#   recovery 0xb490000  69,009,408
#   super    0x19400000 9,437,184,000
#   dtbo     0x7180000  8,388,608
#   userdata 0x2b7e00000, size 0 (fills the rest; 128/256/512 GB variants)
# The PIT does not carry the disk total or the Android super free tail, so
# SUPER_TAIL_START stays 0 and the loader refuses every write inside super.
LOG_IN_RECOVERY=1
SUPER_TAIL_START=0              # 0 refuses every write inside super
ROOT_PART=
USERLAND_VARS="SOFTWARE_PASSCODE=1"

# --- board parts (stock z3s DTB) --------------------------------------------------------------------
PANEL=s6e3hab_hubble3           # 1440x3200@60, 1080x2400@120 modes
TOUCH="sec_ts y79a_z3 @0x48 (tsp_sec/y79a_z3.bin)"
WIFI_FW=bcmdhd_sta.bin_b1
PMIC_GAUGE="MAX77705 @0x66 hsi2c7"

# --- what the run needs -----------------------------------------------------------------------------
DEFAULT_SECS=900
