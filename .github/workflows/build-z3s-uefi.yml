name: build-z3s-uefi

# Build the Galaxy S20 Ultra (z3s) UEFI firmware volume on a GitHub runner.
# The result is Build/z3sPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd, uploaded
# as the "z3s-uefi" artifact. Nothing here flashes or boots a phone.

on:
  workflow_dispatch:
  push:
    paths:
      - 'devices/exynos990/z3s/**'
      - 'xnuloader/**'
      - 'xnu/mkxnuimg.py'
      - 'tools/z3s-boot-verify.py'
      - '.github/workflows/build-z3s-uefi.yml'

permissions:
  contents: read

# A push can touch several z3s files. Keep only the newest build alive so
# the runner is not tied up by an older commit.
concurrency:
  group: build-z3s-uefi-${{ github.ref }}
  cancel-in-progress: true

env:
  MU_REPO: https://github.com/Project-Silicium/Mu-Silicium.git
  # Mu-Silicium main when the z3s package was written. Bump deliberately.
  MU_COMMIT: cc64daf0e05b7533995e4fd01e0f5043ec26c137

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            uuid-dev nasm iasl mono-devel \
            python3 python3-pip python3-venv \
            gettext locales gnupg ca-certificates git

      - name: Check the toolchain
        run: |
          set -e
          for tool in clang lld-link llvm-lib llvm-rc nasm iasl; do
            command -v "$tool" || {
              echo "missing required tool: $tool" >&2
              exit 1
            }
          done
          clang --version
          iasl -v 2>&1 | head -3

      - name: Clone Mu-Silicium
        run: |
          git clone --filter=blob:none --no-checkout "$MU_REPO" Mu-Silicium
          git -C Mu-Silicium checkout --detach "$MU_COMMIT"
          git -C Mu-Silicium submodule update --init \
            Binaries Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
          # Only the Mu_Basecore submodules the z3s platform can compile.
          # SPDM and unit-test submodules are deliberately not fetched.
          # The MipiSysT nested googletest/pugixml are not registered in
          # Mu_Basecore/.gitmodules, so they cannot be named here.
          git -C Mu-Silicium/Mu_Basecore submodule update --init \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdeModulePkg/Library/BrotliCustomDecompressLib/brotli \
            MdeModulePkg/Universal/RegularExpressionDxe/oniguruma \
            MdePkg/Library/BaseFdtLib/libfdt \
            MdePkg/Library/MipiSysTLib/mipisyst

      - name: Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/edk2-venv"
          . "$RUNNER_TEMP/edk2-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r Mu-Silicium/pip-requirements.txt

      - name: Build z3s UEFI
        run: |
          . "$RUNNER_TEMP/edk2-venv/bin/activate"
          # CLANGPDB reads its prefix from CLANG_BIN (ENV(CLANG_BIN)),
          # not from CLANGPDB_AARCH64_PREFIX.
          export CLANG_BIN=/usr/bin/
          cd devices/exynos990/z3s/uefi-z3s
          ./build.sh "$GITHUB_WORKSPACE/Mu-Silicium" 2>&1 |
            tee "$GITHUB_WORKSPACE/z3s-uefi-build.log"

      - name: Collect and verify the FD
        run: |
          set -e
          fd="$GITHUB_WORKSPACE/Mu-Silicium/Build/z3sPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd"
          test -f "$fd"
          mkdir -p dist/z3s-uefi
          cp "$fd" dist/z3s-uefi/SILICIUM_UEFI.fd
          cd dist/z3s-uefi
          sha256sum SILICIUM_UEFI.fd > SHA256SUMS
          python3 - <<'PY'
          from pathlib import Path
          fd = Path("SILICIUM_UEFI.fd").read_bytes()
          if len(fd) != 0x200000:
              raise SystemExit(f"FD size {len(fd):#x}, expected 0x200000")
          if fd[0x28:0x2c] != b"_FVH":
              raise SystemExit(f"no _FVH signature at 0x28: {fd[0x28:0x2c]!r}")
          print(f"FD ok: {len(fd)} bytes, _FVH at 0x28")
          PY
          ls -l

      - name: Upload the FD
        uses: actions/upload-artifact@v4
        with:
          name: z3s-uefi
          path: dist/z3s-uefi/
          if-no-files-found: error

      - name: Build the loader for the z3s payload window
        run: |
          set -e
          cd xnuloader
          PAYLOAD_BASE=0xF0000000 PAYLOAD_MAX_SIZE=0x00F00000 \
            PANIC_LOG_BASE=0xF0F00000 ./build.sh
          cd ..
          test -f xnuloader/loader.efi
          sha256sum xnuloader/loader.efi

      - name: Build the boot shim and the z3s recovery image
        run: |
          set -e
          # z3s/uefi-z3s/build.sh copied the z3s BootShim.S into the Mu tree.
          make -C Mu-Silicium/BootShim REQUIRES_KERNEL_HEADER=1 \
            FD_BASE=0xE8000000 FD_SIZE=0x200000 \
            CFLAGS="--target=aarch64-linux-gnu -DPAYLOAD_BASE=0xF0000000"
          MU="$GITHUB_WORKSPACE/Mu-Silicium" \
            ./devices/exynos990/z3s/build-boot.sh \
              "$GITHUB_WORKSPACE/Mu-Silicium/Build/z3sPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd" \
              dist/z3s-boot
          ls -l dist/z3s-boot

      - name: Upload the boot image
        uses: actions/upload-artifact@v4
        with:
          name: z3s-boot
          path: dist/z3s-boot/
          if-no-files-found: error

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z3s-uefi-build-log
          path: z3s-uefi-build.log
          if-no-files-found: ignore
