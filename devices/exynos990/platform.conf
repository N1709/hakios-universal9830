# Exynos 990 platform: shared by every target (like ExtremeROM's platform/exynos990).
# Plain KEY="value" lines; bash can source this file.
PLATFORM_SOC="exynos990"
PLATFORM_XNU_TAG="xnu-8796.121.2"
PLATFORM_IOS_BUILD="20F66"
PLATFORM_GIC="2"
PLATFORM_PROTECTED_PARTITIONS="efs sec_efs radio modem bootloader sboot param up_param dtbo vbmeta vbmeta_samsung"

# Boot-args of drivers every 990 phone shares: battery/PMIC, USB, Mali/Metal, display
# engine, UFS storage and the iOS root, Bluetooth, ABOX sound, CPU idle/DVFS.
PLATFORM_BOOTARGS="bms=1 bms_wdt=1 bms_ilim=1 bms_hv=1 usb_gadget=5 usb_ecm=1 usb_mux=1 mali=1 mali_irq=1 cpumask=0xff dvfs=2 cpuidle=1 jit_flush=1 fb_threads=6 fb_te=1 fb_bl=1 fb_scaler=1 fb_mode=1 fb_mode_lpref=1 metal=1 mediamtl=1 camtl=1 ufs=2 ufs_native=1 ufs_root=@ROOT_PART@:@ROOT_OFF@:@ROOT_LEN@ ufs_userdata_all=1 ufs_write=1 ufs_tw=1 var_hfs=1 bt=1 snd=1 autounlock=0"
