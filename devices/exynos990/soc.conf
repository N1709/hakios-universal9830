# The Exynos 990 family's layer, in HakiOS's soc.conf format (docs/porting/repositories.md upstream).
# Shared by every target in this directory; platform.json / platform.conf hold what the release tools read.

soc exynos990
	title       Samsung Exynos 990 (2x Mongoose M5, 2x Cortex-A76, 4x Cortex-A55)
	vendor      Samsung
	cores       8, the biggest are cores 6 and 7 (M5)
	gpu         Mali-G77 MP11 (Metal through redwoodmetal / Panfrost v9)
	maintainer  Jesvi iOS (README.md)
