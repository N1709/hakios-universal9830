# Galaxy S20 Ultra 5G (SM-G988B). Exynos 990, 12/16 GB, 1440x3200.
# Facts from the stock G988BXXUBDUI5 boot image and device tree; the GPT is not measured.
TARGET_NAME="Galaxy S20 Ultra 5G"
TARGET_CODENAME="z3s"
TARGET_STATUS="unmaintained"
TARGET_ASSERT_MODEL="SM-G988B"
TARGET_ASSERT_BOOTLOADER="G988BXXUBDUI5"
TARGET_RECOVERY_PRODUCTS="z3s"

TARGET_RAM_GB="12 16"
TARGET_STORAGE_GB="128 256 512"
TARGET_DISPLAY_RESOLUTION="1440x3200"
TARGET_DISPLAY_REFRESH_RATES="60,120"
TARGET_DISPLAY_CUTOUT="center"
TARGET_PANEL="s6e3hab_hubble3"
TARGET_TOUCH="sec_ts"
TARGET_MODEM="5g"
TARGET_WIFI_CHIP="bcm4375"
TARGET_NFC_CHIP="SLSI"
TARGET_FINGERPRINT="ultrasonic"
TARGET_HAS_SPEN="false"
TARGET_HAS_ESIM="true"
TARGET_HAPTIC_CHIP="cs40l25"
TARGET_TORCH_CHIP="s2mpb02"
TARGET_SENSORHUB="bcm_sensorhub_a1"

TARGET_BOARD_CONF="common/devices/z3s.conf"
TARGET_UEFI="devices/exynos990/z3s/uefi-z3s (source package, not built)"
TARGET_FIRMWARE="fw-wifi fw-sound fw-sensors fw-haptic"
# Board drivers shared with x1slte: touch, haptics, sensor hub, torch, Broadcom PCIe Wi-Fi.
# No cam= yet: the Ultra's sensor set differs from the S20's, and it has not been measured.
TARGET_BOOTARGS="touch_ts=1 haptic=5 shub=6 torch=3 wifi_pcie=4 wifi_nvram=1 wifi_pcie_wait=3 touchid=1"

TARGET_SUPER_GROUP_NAME="group_basic"
TARGET_SUPER_PARTITION_SIZE=""
TARGET_SUPER_GROUP_SIZE=""
