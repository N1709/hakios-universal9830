# Galaxy S20 LTE (SM-G980F), in HakiOS's device.conf format. The status is what was seen on this phone;
# details and boot arguments in docs/devices/x1slte/ and docs/SHIPPING.md. device.json is what the release tools read.

device x1slte
	title       Galaxy S20 LTE (SM-G980F, 128 GB)
	vendor      Samsung
	soc         exynos990
	defconfig   x1slte.cmdline
	firmware    tools/s20-firmware.sh
	maintainer  Jesvi iOS (README.md)
	status      display     works     FHD+ up to 120 Hz (real ProMotion), factory brightness, auto-brightness, AOD (off by default)
	status      touch       works     multitouch, pocket rejection on the lock screen
	status      buttons     works     power, volume
	status      cpu         works     Samsung's DVFS tables; idle on small cores with the screen off
	status      gpu         works     Metal on the Mali-G77; OpenGL ES games through Mesa (named apps)
	status      storage     works     system in super, all of userdata as HFS+ (TurboWrite on)
	status      audio       works     speaker, earpiece, microphone; video and calls with sound
	status      battery     works     MAX77705 charging and gauge; 9 V fast charge untested
	status      haptic      works     vibration (haptic=5), strength haptic_max_pct
	status      camera      works     front + three rear lenses by zoom, photo and video, autofocus on the main lens
	status      torch       works     flash LED
	status      wifi        works     2.4 and 5 GHz
	status      bluetooth   works     A2DP audio verified (Galaxy Buds2 Pro)
	status      cellular    works     4G data, VoLTE calls both ways, SMS in Messages
	status      network     works     USB networking (CDC-ECM), Finder/usbmux file access
	status      thermal     works     kernel throttling and thermal steps
	status      usb         works     serial console, networking, Finder
	status      sensors     works     accelerometer, gyro, compass, proximity, light; GPS partial (real fixes host-assisted, Core Location on the phone alone pending); fingerprint missing
